name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test (offline)
        run: pytest
      - name: Sample forms regenerate cleanly
        run: python scripts/generate_sample_forms.py "$RUNNER_TEMP/forms"
      - name: CLI smoke test
        run: |
          formfill list-templates
          formfill validate --template northwind_beneficiary_change --client CL-1001

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t form-fill-engine:ci .
      - name: Image runs the CLI
        run: docker run --rm form-fill-engine:ci formfill list-templates
